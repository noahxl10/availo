name: Build, test, and audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      JWT_ACCESS_SECRET: ci-only-access-secret-that-is-not-deployed
      JWT_REFRESH_SECRET: ci-only-refresh-secret-that-is-not-deployed

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: |
          touch apps/api/prisma/ci.db
          npm exec --workspace @availo/api -- prisma migrate deploy

      - name: Seed test database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Block unreviewed high production dependency advisories
        run: npm run audit:production

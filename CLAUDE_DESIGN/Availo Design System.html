<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Availo — Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="tokens.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1a1916; font-family: 'DM Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3d3a; border-radius: 3px; }
    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/brand.jsx"></script>
  <script type="text/babel" src="components/components.jsx"></script>
  <script type="text/babel" src="components/screens.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#1e8f88",
      "darkMode": false,
      "screenScale": 0.58,
      "showTokens": true
    }/*EDITMODE-END*/;

    const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakToggle, TweakSlider } = window;

    // ── DESIGN TOKENS PANEL ──────────────────────────────────────
    const TokensPanel = () => (
      <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12 }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#7d7970', marginBottom: 20 }}>Design Tokens</div>

        {/* Spacing */}
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: '#a8a49c', letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 12 }}>Spacing (4px grid)</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {[[1,4],[2,8],[3,12],[4,16],[5,20],[6,24],[8,32],[10,40],[12,48],[16,64],[20,80]].map(([t, px]) => (
              <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ width: 70, fontSize: 10, fontFamily: 'monospace', color: '#5c5852' }}>space-{t}</div>
                <div style={{ height: 10, background: '#1e8f88', borderRadius: 2, width: px * 0.8, flexShrink: 0 }} />
                <div style={{ fontSize: 10, color: '#a8a49c', fontFamily: 'monospace' }}>{px}px</div>
              </div>
            ))}
          </div>
        </div>

        {/* Radii */}
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: '#a8a49c', letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 12 }}>Border Radii</div>
          <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
            {[['sm', 6], ['md', 10], ['lg', 14], ['xl', 20], ['pill', 99]].map(([n, r]) => (
              <div key={n} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                <div style={{ width: 36, height: 36, background: '#eef7f6', border: '1.5px solid #2ea69f', borderRadius: r }} />
                <div style={{ fontSize: 10, color: '#7d7970', textAlign: 'center' }}>
                  <div style={{ fontFamily: 'monospace', color: '#1e8f88' }}>radius-{n}</div>
                  <div style={{ color: '#a8a49c' }}>{r === 99 ? '999px' : `${r}px`}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Shadows */}
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: '#a8a49c', letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 14 }}>Shadows</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {[
              ['xs', '0 1px 2px rgba(0,0,0,0.05)'],
              ['sm', '0 2px 6px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)'],
              ['md', '0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04)'],
              ['lg', '0 8px 32px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05)'],
              ['xl', '0 16px 48px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06)'],
            ].map(([n, v]) => (
              <div key={n} style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                <div style={{ width: 48, height: 28, background: '#fff', borderRadius: 8, boxShadow: v }} />
                <div>
                  <div style={{ fontSize: 11, fontFamily: 'monospace', color: '#1e8f88' }}>shadow-{n}</div>
                  <div style={{ fontSize: 9, color: '#a8a49c', fontFamily: 'monospace', maxWidth: 240 }}>{v}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* CSS Variables */}
        <div>
          <div style={{ fontSize: 11, fontWeight: 600, color: '#a8a49c', letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 10 }}>CSS Custom Properties</div>
          <div style={{ background: '#1a1916', borderRadius: 10, padding: 14 }}>
            <pre style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: '#5cbab4', margin: 0, lineHeight: 1.8 }}>{`
:root {
  --color-accent:    #1e8f88;
  --color-bg:        #f8f8f7;
  --color-surface:   #ffffff;
  --color-border:    #e4e2de;
  --color-text:      #1a1916;
  --color-muted:     #7d7970;
  --color-subtle:    #a8a49c;

  --font-display: 'DM Serif Display';
  --font-body:    'DM Sans';
  --font-mono:    'JetBrains Mono';

  --radius-sm:    6px;
  --radius-md:    10px;
  --radius-lg:    14px;
  --radius-xl:    20px;
  --radius-pill:  999px;

  --space-1:  4px;  --space-2:  8px;
  --space-3: 12px;  --space-4: 16px;
  --space-5: 20px;  --space-6: 24px;
  --space-8: 32px;  --space-10:40px;
  --space-12:48px;  --space-16:64px;
}`}</pre>
          </div>
        </div>
      </div>
    );

    // ── COMPONENT SHOWCASE ───────────────────────────────────────
    const ComponentsShowcase = () => (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 32, fontFamily: "'DM Sans', sans-serif" }}>
        {/* Sidebar */}
        <div>
          <Label>Sidebar Navigation</Label>
          <div style={{ display: 'flex', gap: 16, height: 420, border: '1px solid #e4e2de', borderRadius: 14, overflow: 'hidden' }}>
            <SidebarNav />
            <div style={{ flex: 1, background: '#f8f8f7', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ color: '#cac7c1', fontSize: 13 }}>Page content area</div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 16, marginTop: 12, height: 200, border: '1px solid #e4e2de', borderRadius: 14, overflow: 'hidden' }}>
            <SidebarNav collapsed={true} />
            <div style={{ flex: 1, background: '#f8f8f7', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ color: '#cac7c1', fontSize: 12 }}>Collapsed state</div>
            </div>
          </div>
        </div>

        {/* Stat Cards */}
        <div>
          <Label>Dashboard Cards</Label>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 14 }}>
            <StatCard label="Bookings this month" value="84" delta="12%" sub="vs last month" />
            <StatCard label="Revenue" value="$6,240" delta="8.4%" sub="vs last month" />
            <StatCard label="Upcoming" value="23" sub="next in 4h" />
            <StatCard label="Avg. party size" value="3.2" delta="0.4" deltaDir="up" sub="vs last month" />
          </div>
        </div>

        {/* Listing Cards */}
        <div>
          <Label>Listing Cards</Label>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14 }}>
            <ListingCard title="Morning Kayak Tour" type="Tour · 2 hours" price="$65/guest" capacity={8} status="active" />
            <ListingCard title="Sunset Paddleboard" type="Rental · 1.5 hours" price="$45/guest" capacity={6} status="paused" />
            <ListingCard title="Junior Ocean Class" type="Class · 1 hour" price="$35/guest" capacity={8} status="draft" />
          </div>
        </div>

        {/* Calendar */}
        <div>
          <Label>Calendar / Time-slot Picker</Label>
          <CalendarPicker />
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
          {/* Guest selector */}
          <div>
            <Label>Guest Selector</Label>
            <GuestSelector />
          </div>

          {/* Add-on selector */}
          <div>
            <Label>Add-on Selector</Label>
            <AddonSelector />
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
          {/* Checkout */}
          <div>
            <Label>Checkout Summary</Label>
            <CheckoutSummary />
          </div>

          {/* Confirmation */}
          <div>
            <Label>Booking Confirmation</Label>
            <BookingConfirmation />
          </div>
        </div>

        {/* Empty states */}
        <div>
          <Label>Empty States</Label>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14 }}>
            <EmptyState icon="◫" title="No listings yet" body="Create your first listing to start accepting bookings." cta="+ Create Listing" />
            <EmptyState icon="◷" title="No bookings yet" body="Share your booking link to receive your first reservation." />
            <EmptyState icon="▦" title="No availability set" body="Configure your available dates and time slots for this listing." cta="Set Availability" />
          </div>
        </div>

        {/* Settings form */}
        <div>
          <Label>Settings Form</Label>
          <SettingsForm />
        </div>

        {/* Buttons */}
        <div>
          <Label>Buttons &amp; Form Controls</Label>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginBottom: 14 }}>
            {[
              { label: 'Primary', bg: '#1e8f88', color: '#fff', border: 'none' },
              { label: 'Secondary', bg: '#fff', color: '#1a1916', border: '1.5px solid #e4e2de' },
              { label: 'Danger', bg: '#fef0f0', color: '#d94f4f', border: '1.5px solid #f9c4c4' },
              { label: 'Ghost', bg: 'transparent', color: '#1e8f88', border: '1.5px solid #2ea69f' },
            ].map(b => (
              <button key={b.label} style={{ padding: '9px 18px', borderRadius: 9, background: b.bg, color: b.color, border: b.border, fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: "'DM Sans', sans-serif" }}>{b.label}</button>
            ))}
            <button disabled style={{ padding: '9px 18px', borderRadius: 9, background: '#f1f0ee', color: '#a8a49c', border: 'none', fontSize: 13, fontWeight: 600, cursor: 'not-allowed', fontFamily: "'DM Sans', sans-serif" }}>Disabled</button>
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 14 }}>
            {[
              { label: 'Confirmed', bg: '#edf7f2', color: '#1a9e6e' },
              { label: 'Pending', bg: '#fef6ec', color: '#e08c2a' },
              { label: 'Cancelled', bg: '#fef0f0', color: '#d94f4f' },
              { label: 'Draft', bg: '#f1f0ee', color: '#7d7970' },
              { label: 'Active', bg: '#eef7f6', color: '#177870' },
              { label: 'Full', bg: '#1e8f88', color: '#fff' },
            ].map(b => (
              <span key={b.label} style={{ display: 'inline-block', background: b.bg, color: b.color, fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 99 }}>{b.label}</span>
            ))}
          </div>
        </div>
      </div>
    );

    const Label = ({ children }) => (
      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#7d7970', marginBottom: 14 }}>{children}</div>
    );

    // ── SCREEN FRAME ─────────────────────────────────────────────
    const ScreenFrame = ({ title, children, width = 1100, height = 700 }) => (
      <div>
        <div style={{ fontSize: 11, fontWeight: 600, color: '#a8a49c', letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 10 }}>{title}</div>
        <div style={{ width, height, borderRadius: 16, overflow: 'hidden', border: '1px solid #e4e2de', boxShadow: '0 8px 40px rgba(0,0,0,0.12)', position: 'relative' }}>
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 36, background: '#2a2825', display: 'flex', alignItems: 'center', gap: 8, padding: '0 14px', zIndex: 10 }}>
            {['#d94f4f','#e08c2a','#1a9e6e'].map((c, i) => <div key={i} style={{ width: 10, height: 10, borderRadius: '50%', background: c }} />)}
            <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
              <div style={{ background: '#1a1916', borderRadius: 5, padding: '3px 20px', fontSize: 10, color: '#6e736e', fontFamily: 'monospace' }}>app.availo.io</div>
            </div>
          </div>
          <div style={{ paddingTop: 36, height: '100%' }}>
            {children}
          </div>
        </div>
      </div>
    );

    // ── WIDGET SHOWCASE ──────────────────────────────────────────
    const WidgetShowcase = () => (
      <div style={{ fontFamily: "'DM Sans', sans-serif", display: 'flex', flexDirection: 'column', gap: 32 }}>
        <div>
          <Label>Public Booking Widget — Full</Label>
          <div style={{ display: 'flex', gap: 32, alignItems: 'flex-start' }}>
            <BookingWidget />
            <div style={{ flex: 1, maxWidth: 340 }}>
              <div style={{ background: '#f8f8f7', border: '1px solid #e4e2de', borderRadius: 14, padding: '20px 22px' }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: '#1a1916', marginBottom: 12 }}>Widget Features</div>
                {[
                  'Embeds on any HTML page via script tag',
                  'Respects your brand accent color',
                  'Light / Dark / Auto theme modes',
                  'Step-by-step: Date → Guests → Confirm',
                  'Stripe-powered payment (not shown)',
                  'Confirmation sent automatically',
                  'Mobile responsive, zero dependencies',
                ].map((f, i) => (
                  <div key={i} style={{ display: 'flex', gap: 10, marginBottom: 8 }}>
                    <span style={{ color: '#1e8f88', fontWeight: 700, fontSize: 12, flexShrink: 0, marginTop: 1 }}>✓</span>
                    <span style={{ fontSize: 13, color: '#5c5852' }}>{f}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    );

    // ── MOBILE SCREENS ───────────────────────────────────────────
    const MobileFrame = ({ title, children }) => (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: '#a8a49c', letterSpacing: '0.08em', textTransform: 'uppercase' }}>{title}</div>
        <div style={{ width: 320, background: '#1a1916', borderRadius: 40, padding: '10px', boxShadow: '0 16px 48px rgba(0,0,0,0.3)' }}>
          <div style={{ borderRadius: 32, overflow: 'hidden', background: '#fff', position: 'relative' }}>
            {/* Status bar */}
            <div style={{ background: '#1a1916', height: 44, display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', padding: '0 20px 10px', flexShrink: 0 }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#fff' }}>9:41</div>
              <div style={{ width: 100, height: 26, background: '#000', borderRadius: 13, position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)' }} />
              <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
                {[4,4,4].map((_, i) => <div key={i} style={{ width: 4, height: 4 + i * 2, background: '#fff', borderRadius: 1 }} />)}
                <div style={{ fontSize: 11, color: '#fff' }}>◾</div>
              </div>
            </div>
            <div style={{ height: 560, overflow: 'hidden' }}>
              {children}
            </div>
            {/* Home indicator */}
            <div style={{ height: 30, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#fff' }}>
              <div style={{ width: 100, height: 4, background: '#1a1916', borderRadius: 2 }} />
            </div>
          </div>
        </div>
      </div>
    );

    const MobileWidget = () => (
      <div style={{ background: '#f8f8f7', height: '100%', padding: 16, fontFamily: "'DM Sans', sans-serif", overflow: 'auto' }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#1a1916', marginBottom: 4 }}>Morning Kayak Tour</div>
        <div style={{ fontSize: 12, color: '#7d7970', marginBottom: 16 }}>Ocean Tours Co. · 2 hours · from $65</div>
        <BookingWidget compact={true} />
      </div>
    );

    const MobileDashboard = () => {
      const bookings = [
        { name: 'Lena M.', listing: 'Kayak Tour', time: 'Today, 9 AM', guests: 3, status: 'confirmed' },
        { name: 'Ray J.', listing: 'Paddleboard', time: 'Today, 5:30 PM', guests: 2, status: 'confirmed' },
        { name: 'Dana C.', listing: 'Sea Cave', time: 'Tomorrow, 8 AM', guests: 6, status: 'pending' },
      ];
      return (
        <div style={{ background: '#f8f8f7', height: '100%', fontFamily: "'DM Sans', sans-serif", overflow: 'auto' }}>
          <div style={{ background: '#1a1916', padding: '16px 18px 20px' }}>
            <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 4 }}>Good morning, Jamie</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: '#fff', letterSpacing: '-0.3px' }}>Dashboard</div>
          </div>
          <div style={{ padding: '16px 14px', display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {[['Bookings', '84', '↑12%'], ['Revenue', '$6.2k', '↑8%']].map(([l, v, d]) => (
                <div key={l} style={{ background: '#fff', border: '1px solid #e4e2de', borderRadius: 12, padding: '14px 16px' }}>
                  <div style={{ fontSize: 11, color: '#7d7970', marginBottom: 4 }}>{l}</div>
                  <div style={{ fontSize: 22, fontWeight: 700, color: '#1a1916', letterSpacing: '-0.5px' }}>{v}</div>
                  <div style={{ fontSize: 11, color: '#1a9e6e', fontWeight: 600, marginTop: 2 }}>{d}</div>
                </div>
              ))}
            </div>
            <div style={{ background: '#fff', border: '1px solid #e4e2de', borderRadius: 12, overflow: 'hidden' }}>
              <div style={{ padding: '12px 14px', borderBottom: '1px solid #f1f0ee', fontSize: 13, fontWeight: 600, color: '#1a1916' }}>Today's Bookings</div>
              {bookings.map((b, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', borderBottom: i < bookings.length - 1 ? '1px solid #f8f8f7' : 'none' }}>
                  <div style={{ width: 32, height: 32, borderRadius: '50%', background: '#cceae7', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, color: '#177870', flexShrink: 0 }}>
                    {b.name.split(' ').map(n => n[0]).join('')}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, fontWeight: 600, color: '#1a1916' }}>{b.name} · {b.listing}</div>
                    <div style={{ fontSize: 11, color: '#7d7970' }}>{b.time} · {b.guests} guests</div>
                  </div>
                  <div style={{ fontSize: 10, fontWeight: 600, padding: '2px 7px', borderRadius: 99, background: b.status === 'confirmed' ? '#edf7f2' : '#fef6ec', color: b.status === 'confirmed' ? '#1a9e6e' : '#e08c2a' }}>{b.status}</div>
                </div>
              ))}
            </div>
          </div>
          {/* Bottom nav */}
          <div style={{ position: 'sticky', bottom: 0, background: '#fff', borderTop: '1px solid #e4e2de', display: 'flex', padding: '8px 0 4px' }}>
            {[['⊡','Home'],['◫','Listings'],['◷','Bookings'],['◎','Settings']].map(([icon, label], i) => (
              <div key={label} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, padding: '2px 0', cursor: 'pointer' }}>
                <div style={{ fontSize: 18, color: i === 0 ? '#1e8f88' : '#a8a49c', lineHeight: 1 }}>{icon}</div>
                <div style={{ fontSize: 9, fontWeight: i === 0 ? 600 : 400, color: i === 0 ? '#1e8f88' : '#a8a49c' }}>{label}</div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const MobileResponsive = () => (
      <div style={{ fontFamily: "'DM Sans', sans-serif", display: 'flex', flexDirection: 'column', gap: 24 }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: '#7d7970', marginBottom: 4 }}>Mobile Treatment</div>
        <div style={{ display: 'flex', gap: 40, flexWrap: 'wrap', justifyContent: 'center' }}>
          <MobileFrame title="Operator Dashboard">
            <MobileDashboard />
          </MobileFrame>
          <MobileFrame title="Guest Booking Widget">
            <MobileWidget />
          </MobileFrame>
        </div>
      </div>
    );

    // ── MAIN APP ─────────────────────────────────────────────────
    const App = () => {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      return (
        <DesignCanvas>
          {/* Section 1: Brand */}
          <DCSection id="brand" title="Brand Identity">
            <DCArtboard id="brand-main" label="01 — Names · Logos · Colors · Type" width={900} height={2400}>
              <div style={{ padding: 40, background: '#ffffff', height: '100%' }}>
                <BrandSection />
              </div>
            </DCArtboard>
            <DCArtboard id="tokens" label="02 — Design Tokens" width={520} height={2400}>
              <div style={{ padding: 36, background: '#ffffff', height: '100%' }}>
                <TokensPanel />
              </div>
            </DCArtboard>
          </DCSection>

          {/* Section 2: Components */}
          <DCSection id="components" title="Component Library">
            <DCArtboard id="comp-main" label="All Components" width={860} height={3200}>
              <div style={{ padding: 40, background: '#ffffff', height: '100%' }}>
                <ComponentsShowcase />
              </div>
            </DCArtboard>
          </DCSection>

          {/* Section 3: Screens */}
          <DCSection id="screens" title="Example Screens">
            <DCArtboard id="screen-login" label="Login — Phone Auth" width={1100} height={736}>
              <ScreenFrame title="" width={1100} height={736}>
                <LoginScreen />
              </ScreenFrame>
            </DCArtboard>
            <DCArtboard id="screen-onboard" label="Onboarding" width={1100} height={736}>
              <ScreenFrame title="" width={1100} height={736}>
                <OnboardingScreen />
              </ScreenFrame>
            </DCArtboard>
            <DCArtboard id="screen-dashboard" label="Dashboard Overview" width={1100} height={736}>
              <ScreenFrame title="" width={1100} height={736}>
                <DashboardScreen />
              </ScreenFrame>
            </DCArtboard>
            <DCArtboard id="screen-listings" label="Listings Manager" width={1100} height={736}>
              <ScreenFrame title="" width={1100} height={736}>
                <ListingsScreen />
              </ScreenFrame>
            </DCArtboard>
            <DCArtboard id="screen-create" label="Create / Edit Listing" width={1100} height={736}>
              <ScreenFrame title="" width={1100} height={736}>
                <CreateListingScreen />
              </ScreenFrame>
            </DCArtboard>
            <DCArtboard id="screen-booking" label="Booking Detail" width={1100} height={736}>
              <ScreenFrame title="" width={1100} height={736}>
                <BookingDetailScreen />
              </ScreenFrame>
            </DCArtboard>
            <DCArtboard id="screen-embed" label="Embed Setup" width={1100} height={736}>
              <ScreenFrame title="" width={1100} height={736}>
                <EmbedScreen />
              </ScreenFrame>
            </DCArtboard>
          </DCSection>

          {/* Section 4: Widget + Mobile */}
          <DCSection id="widget" title="Booking Widget & Mobile">
            <DCArtboard id="widget-full" label="Public Booking Widget" width={700} height={560}>
              <div style={{ padding: 40, background: '#f8f8f7', height: '100%' }}>
                <WidgetShowcase />
              </div>
            </DCArtboard>
            <DCArtboard id="mobile" label="Responsive Mobile" width={800} height={700}>
              <div style={{ padding: 40, background: '#f1f0ee', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <MobileResponsive />
              </div>
            </DCArtboard>
          </DCSection>

          <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
            <TweakSection label="Brand">
              <TweakColor id="accentColor" label="Accent Color" />
            </TweakSection>
            <TweakSection label="Canvas">
              <TweakToggle id="darkMode" label="Dark Mode Preview" />
            </TweakSection>
          </TweaksPanel>
        </DesignCanvas>
      );
    };

    // ── BOOTSTRAP ────────────────────────────────────────────────
    // Wait for design-canvas to define DCCanvas etc.
    const waitForCanvas = (cb, tries = 0) => {
      if (window.DesignCanvas) { cb(); return; }
      if (tries > 50) { console.error('DesignCanvas not loaded'); return; }
      setTimeout(() => waitForCanvas(cb, tries + 1), 100);
    };

    waitForCanvas(() => {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    });
  </script>
</body>
</html>
